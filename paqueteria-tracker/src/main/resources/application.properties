spring.application.name=syncservice
server.port=8081

# MongoDB (Docker local)
spring.mongodb.uri=mongodb://localhost:27017/hidrogest_replica

# MySQL - monolito HidroGest (solo lectura)
spring.datasource.url=jdbc:mysql://localhost:3307/hydrogest?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA - solo lectura, sin crear ni modificar tablas
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.jpa.open-in-view=false