<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HidroGest Sync — Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, sans-serif;
            background: #0f1117;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 40px 24px;
        }

        .container { max-width: 720px; margin: 0 auto; }

        header { margin-bottom: 40px; }
        header h1 { font-size: 1.6rem; font-weight: 700; color: #fff; }
        header p { color: #64748b; margin-top: 4px; font-size: 14px; }

        .card {
            background: #1e2130;
            border: 1px solid #2d3348;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .card h2 {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 16px;
        }

        .status-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .pill.ok      { background: #14532d; color: #4ade80; }
        .pill.running { background: #1e3a5f; color: #60a5fa; }
        .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
        .pill.running .dot { animation: pulse 1s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

        .meta-line { font-size: 13px; color: #94a3b8; }
        .meta-line strong { color: #cbd5e1; }

        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th {
            text-align: left;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: #64748b;
            padding: 0 0 10px;
        }
        td { padding: 8px 0; border-top: 1px solid #2d3348; color: #cbd5e1; }
        td:last-child { text-align: right; font-family: monospace; color: #60a5fa; font-weight: 600; }

        #btn-sync {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s;
        }
        #btn-sync:hover { background: #1d4ed8; }
        #btn-sync:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

        .progress-wrap { margin-top: 20px; display: none; }
        .progress-wrap.visible { display: block; }
        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        .progress-track { background: #2d3348; border-radius: 99px; height: 10px; overflow: hidden; }
        .progress-bar {
            height: 100%;
            background: #2563eb;
            border-radius: 99px;
            width: 0%;
            transition: width .3s ease;
        }

        #log { margin-top: 16px; font-size: 13px; color: #64748b; min-height: 20px; }
    </style>
</head>
<body>
<div class="container">

    <header>
        <h1>HidroGest Sync Service</h1>
        <p>Replicación asíncrona MySQL → MongoDB</p>
    </header>

    <div class="card">
        <h2>Estado del sistema</h2>
        <div class="status-row">
      <span id="sync-pill" class="pill ok">
        <span class="dot"></span>
        <span id="sync-text">Listo</span>
      </span>
        </div>
        <div class="meta-line">Último sync: <strong id="ultimo-sync">—</strong></div>
    </div>

    <div class="card">
        <h2>Documentos en MongoDB</h2>
        <table>
            <thead>
            <tr>
                <th>Colección</th>
                <th style="text-align:right">Documentos</th>
            </tr>
            </thead>
            <tbody id="tabla-colecciones">
            <tr><td colspan="2" style="color:#64748b;text-align:center;padding:16px 0">Cargando...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="card">
        <h2>Sincronización</h2>
        <button id="btn-sync" onclick="iniciarSync()">▶ Iniciar Sync</button>
        <div class="progress-wrap" id="progress-wrap">
            <div class="progress-label">
                <span id="progress-text">Sincronizando...</span>
                <span id="progress-pct">0%</span>
            </div>
            <div class="progress-track">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>
        <div id="log"></div>
    </div>

</div>
<script>
    let pollingInterval = null;
    cargarStatus();

    async function cargarStatus() {
        try {
            const res = await fetch('/sync/status');
            const data = await res.json();
            actualizarStatus(data);
        } catch (e) {
            setLog('No se pudo conectar con el servicio.');
        }
    }

    function actualizarStatus(data) {
        const pill = document.getElementById('sync-pill');
        const text = document.getElementById('sync-text');
        if (data.syncEnCurso) {
            pill.className = 'pill running';
            text.textContent = 'Sincronizando...';
        } else {
            pill.className = 'pill ok';
            text.textContent = 'Listo';
        }

        document.getElementById('ultimo-sync').textContent =
            data.ultimoSync === 'Nunca' ? 'Nunca' : data.ultimoSync;

        const tbody = document.getElementById('tabla-colecciones');
        if (data.colecciones && Object.keys(data.colecciones).length > 0) {
            tbody.innerHTML = Object.entries(data.colecciones).map(([nombre, cant]) =>
                `<tr><td>${nombre}</td><td>${cant.toLocaleString()}</td></tr>`
            ).join('');
        } else {
            tbody.innerHTML = '<tr><td colspan="2" style="color:#64748b;text-align:center;padding:16px 0">Sin datos aún</td></tr>';
        }
    }

    async function iniciarSync() {
        const btn = document.getElementById('btn-sync');
        btn.disabled = true;
        setLog('');

        let res;
        try {
            res = await fetch('/sync', { method: 'POST' });
        } catch (e) {
            setLog('Error: no se pudo conectar.');
            btn.disabled = false;
            return;
        }

        if (res.status === 409) {
            setLog('Ya hay una sincronización en curso.');
            btn.disabled = false;
            return;
        }

        const data = await res.json();
        const jobId = data.jobId;
        setLog(`Job iniciado: ${jobId}`);
        mostrarProgreso(true);

        pollingInterval = setInterval(() => consultarProgreso(jobId), 800);
    }

    async function consultarProgreso(jobId) {
        try {
            const res = await fetch(`/sync/${jobId}`);
            const data = await res.json();
            const pct = data.progress;

            document.getElementById('progress-bar').style.width = pct + '%';
            document.getElementById('progress-pct').textContent = pct + '%';

            if (pct >= 100) {
                clearInterval(pollingInterval);
                document.getElementById('progress-text').textContent = '¡Completado!';
                setLog('Sincronización finalizada.');
                setTimeout(async () => {
                    mostrarProgreso(false);
                    document.getElementById('btn-sync').disabled = false;
                    await cargarStatus();
                }, 1500);
            }
        } catch (e) {
            clearInterval(pollingInterval);
            setLog('Error al consultar progreso.');
            mostrarProgreso(false);
            document.getElementById('btn-sync').disabled = false;
        }
    }

    function mostrarProgreso(visible) {
        const wrap = document.getElementById('progress-wrap');
        if (visible) {
            wrap.classList.add('visible');
            document.getElementById('progress-bar').style.width = '0%';
            document.getElementById('progress-pct').textContent = '0%';
            document.getElementById('progress-text').textContent = 'Sincronizando...';
        } else {
            wrap.classList.remove('visible');
        }
    }

    function setLog(msg) {
        document.getElementById('log').textContent = msg;
    }
</script>
</body>
</html>
