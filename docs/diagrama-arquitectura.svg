<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500"
     role="img" aria-label="Arquitectura integrada de la Fase 2 de HidroGest: monolito CodeIgniter/Laravel con cuatro microservicios: Consulta Pública, Chatbot RAG, Pagos por Colas, y Replicación Asíncrona a NoSQL">

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <polygon points="0 0.5,9 3.5,0 6.5" fill="#666"/>
    </marker>
    <marker id="ahd" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <polygon points="0 0.5,9 3.5,0 6.5" fill="#999"/>
    </marker>
  </defs>

  <!-- ── FONDO ─────────────────────────────────────────────── -->
  <rect width="900" height="500" fill="#f6f5f1"/>

  <!-- ── TÍTULO ───────────────────────────────────────────── -->
  <text x="450" y="18" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="12" font-weight="700" fill="#444">
    HidroGest — Arquitectura Integrada Fase 2
  </text>

  <!-- ══════════════════════════════════════════════════════
       CAPA 0: CLIENTE
  ══════════════════════════════════════════════════════ -->
  <rect x="325" y="26" width="250" height="38" rx="8"
        fill="#dde8f4" stroke="#4272a0" stroke-width="1.5"/>
  <text x="450" y="44" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="12" font-weight="700" fill="#1a3c6e">Cliente / Navegador</text>
  <text x="450" y="57" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="8.5" fill="#3a5a90">web · móvil · Swagger UI</text>

  <!-- ── flecha Cliente → Monolito ── -->
  <line x1="450" y1="64" x2="450" y2="90"
        stroke="#666" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- ══════════════════════════════════════════════════════
       CAPA 1: MONOLITO HEREDADO
  ══════════════════════════════════════════════════════ -->
  <rect x="40" y="90" width="820" height="68" rx="10"
        fill="#2e4080" stroke="#1a2a60" stroke-width="1.5"/>
  <text x="450" y="116" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="14" font-weight="700" fill="#ffffff">Monolito Heredado — HidroGest</text>
  <text x="450" y="133" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="9.5" fill="#b8c8f0">
    CodeIgniter 4 / Laravel · Bootstrap 5 · Auth · Clientes · Contadores · Lecturas · Pagos
  </text>
  <text x="450" y="148" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="9.5" fill="#a0b8e8">
    MySQL / MariaDB :3307 · db: hydrogest · NO SE MODIFICA
  </text>

  <!-- ══════════════════════════════════════════════════════
       CAPA 2: CUATRO FEATURES
  ══════════════════════════════════════════════════════ -->

  <!-- flechas Monolito → features -->
  <line x1="110" y1="158" x2="110" y2="220" stroke="#666" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="315" y1="158" x2="315" y2="220" stroke="#666" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="520" y1="158" x2="520" y2="220" stroke="#666" stroke-width="1.2" marker-end="url(#ah)"/>
  <!-- F4: flecha especial con nota de lectura directa MySQL -->
  <line x1="755" y1="158" x2="755" y2="220" stroke="#c4a840" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#ah)"/>
  <text x="758" y="190" text-anchor="start"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="7.5" fill="#806010">lee MySQL</text>
  <text x="758" y="200" text-anchor="start"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="7.5" fill="#806010">directamente</text>

  <!-- F1: Consulta Pública + Captcha -->
  <rect x="40" y="220" width="190" height="78" rx="8"
        fill="#fdebd0" stroke="#c87820" stroke-width="1.5"/>
  <text x="135" y="244" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="11.5" font-weight="700" fill="#7a3800">Consulta Pública</text>
  <text x="135" y="259" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="9.5" fill="#904a10">con Captcha</text>
  <text x="135" y="275" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="8" fill="#a05820">Consulta estado de cuenta</text>
  <text x="135" y="287" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="8" fill="#a05820">sin autenticación</text>

  <!-- F2: Chatbot con RAG -->
  <rect x="245" y="220" width="190" height="78" rx="8"
        fill="#ede0f8" stroke="#7840b0" stroke-width="1.5"/>
  <text x="340" y="244" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="11.5" font-weight="700" fill="#3a1a70">Chatbot con RAG</text>
  <text x="340" y="259" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="9.5" fill="#5030a0">LLM + base vectorial</text>
  <text x="340" y="275" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="8" fill="#5830b0">Responde preguntas sobre</text>
  <text x="340" y="287" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="8" fill="#5830b0">la oficina del agua</text>

  <!-- F3: Pagos por Colas -->
  <rect x="450" y="220" width="190" height="78" rx="8"
        fill="#fce8e8" stroke="#c04040" stroke-width="1.5"/>
  <text x="545" y="244" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="11.5" font-weight="700" fill="#7a1010">Pagos por Colas</text>
  <text x="545" y="259" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="9.5" fill="#901818">RabbitMQ / SQS</text>
  <text x="545" y="275" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="8" fill="#a02020">Envío asíncrono de pagos</text>
  <text x="545" y="287" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="8" fill="#a02020">a sistemas externos</text>

  <!-- F4: Replicación NoSQL  ← ESTE MÓDULO (borde más grueso, color diferente) -->
  <rect x="655" y="212" width="205" height="94" rx="8"
        fill="#ece0be" stroke="#c4a840" stroke-width="2.5"/>
  <!-- badge "Este módulo" -->
  <rect x="660" y="217" width="90" height="16" rx="4" fill="#c4a840"/>
  <text x="705" y="228" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="7.5" font-weight="700" fill="#ffffff">★ ESTE MÓDULO</text>
  <text x="757" y="252" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="11.5" font-weight="700" fill="#4a3608">Replicación</text>
  <text x="757" y="267" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="11.5" font-weight="700" fill="#4a3608">Asíncrona NoSQL</text>
  <text x="757" y="283" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="9.5" fill="#7a6018">Spring Boot · Java 17</text>
  <text x="757" y="296" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="8" fill="#8a7030">MySQL → MongoDB · delta sync</text>

  <!-- ══════════════════════════════════════════════════════
       CAPA 3: SISTEMAS EXTERNOS
  ══════════════════════════════════════════════════════ -->

  <!-- F1 → Captcha API -->
  <line x1="135" y1="298" x2="135" y2="378"
        stroke="#666" stroke-width="1.2" marker-end="url(#ah)"/>
  <rect x="58" y="378" width="154" height="46" rx="6"
        fill="#fff4e8" stroke="#c87820" stroke-width="1.2"/>
  <text x="135" y="397" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="10.5" font-weight="600" fill="#904a10">Captcha API</text>
  <text x="135" y="411" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="8" fill="#a05820">Google reCAPTCHA / hCaptcha</text>

  <!-- F2 → LLM + VectorDB -->
  <line x1="340" y1="298" x2="340" y2="378"
        stroke="#666" stroke-width="1.2" marker-end="url(#ah)"/>
  <rect x="263" y="378" width="154" height="46" rx="6"
        fill="#f5eeff" stroke="#7840b0" stroke-width="1.2"/>
  <text x="340" y="397" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="10.5" font-weight="600" fill="#3a1a70">LLM + VectorDB</text>
  <text x="340" y="411" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="8" fill="#5030a0">OpenAI / Ollama · Pinecone/Chroma</text>

  <!-- F3 → Cola + PSP -->
  <line x1="545" y1="298" x2="545" y2="378"
        stroke="#666" stroke-width="1.2" marker-end="url(#ah)"/>
  <rect x="468" y="378" width="154" height="46" rx="6"
        fill="#fff0f0" stroke="#c04040" stroke-width="1.2"/>
  <text x="545" y="397" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="10.5" font-weight="600" fill="#7a1010">Cola + PSP</text>
  <text x="545" y="411" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="8" fill="#901818">RabbitMQ / SQS · pasarela de pago</text>

  <!-- F4 → MongoDB -->
  <line x1="757" y1="306" x2="757" y2="378"
        stroke="#c4a840" stroke-width="2" marker-end="url(#ah)"/>
  <text x="760" y="345" text-anchor="start"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="7.5" fill="#806010">upsert · nunca borra</text>
  <rect x="673" y="378" width="168" height="46" rx="6"
        fill="#a4d490" stroke="#3a8e28" stroke-width="1.5"/>
  <text x="757" y="397" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="11" font-weight="700" fill="#1a4c10">MongoDB</text>
  <text x="757" y="411" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="8" fill="#287a20">db: hidrogest_replica · :27017</text>

  <!-- ── LEYENDA ──────────────────────────────────────────── -->
  <rect x="40" y="442" width="820" height="46" rx="6"
        fill="#eeece6" stroke="#d0cec4" stroke-width="1"/>
  <text x="450" y="457" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="8.5" fill="#666">Leyenda de conexiones</text>

  <!-- linea sólida -->
  <line x1="60" y1="474" x2="100" y2="474" stroke="#666" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="106" y="477" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="8" fill="#555">Llamada HTTP / datos</text>

  <!-- linea punteada -->
  <line x1="280" y1="474" x2="320" y2="474" stroke="#c4a840" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#ah)"/>
  <text x="326" y="477" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="8" fill="#555">Lee MySQL directamente (este módulo)</text>

  <!-- ★ -->
  <rect x="620" y="466" width="12" height="12" rx="2" fill="#c4a840"/>
  <text x="626" y="476" text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="8" fill="#fff">★</text>
  <text x="638" y="477" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="8" fill="#555">Módulo desarrollado en este repositorio</text>

</svg>
